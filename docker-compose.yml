version: '3.8'

services:
  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes

    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_ecommerce
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d fastapi_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - URL=http://app:8000
      - SQLALCHEMY_DATABASE_URL=postgresql+asyncpg://ecommerce:postgres@ecommerce-postgres:5432/fastapi_ecommerce
      - REDIS_HOST=ecommerce-redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  app_support:
    build:
      context: .
      dockerfile: Dockerfile.app_support
    container_name: app_support
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - URL_SUPPORT=http://app_support:8001
      - SQLALCHEMY_DATABASE_URL=postgresql+asyncpg://ecommerce:postgres@ecommerce-postgres:5432/fastapi_ecommerce
      - REDIS_HOST=ecommerce-redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app_support

  celery:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: celery
    command: >
      sh -c "
        celery -A app.celery_app beat --loglevel=INFO &
        celery -A app.celery_app worker --loglevel=INFO --pool=solo
      "
    env_file:
      - .env
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql+asyncpg://ecommerce:postgres@ecommerce-postgres:5432/fastapi_ecommerce
      - REDIS_HOST=ecommerce-redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    container_name: flower
    ports:
      - "5555:5555"
    command: >
      celery
      --broker=redis://ecommerce-redis:6379/0
      flower
      --address=0.0.0.0
      --port=5555
      --persistent=True
      --log-level=INFO
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: