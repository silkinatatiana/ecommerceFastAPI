[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi_ecommerce"
version = "0.1.0"
description = "E-commerce platform built with FastAPI"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "T20", # flake8-print
]

ignore = [
    "E501",  # line too long (ruff format сам управляет длиной)
    "B008",  # Depends() в аргументах — стандартная практика FastAPI!
    "N818",  # Exception name suffix (опционально, можно исправить)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "app_support", "database", "general_functions"]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
order-by-type = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201"]          # Разрешить print в тестах
"app/main.py" = ["T201"]      # Разрешить print в точке входа
"app_support/main.py" = ["T201"]
"redis_client.py" = ["T201"]  # Разрешить print при инициализации
"*/__init__.py" = ["F401"]    # Игнорировать неиспользуемые импорты в __init__
"alembic/env.py" = ["F403", "F401"]  # Игнорировать import * в Alembic

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.envs.default]
dependencies = [
    "ruff>=0.4.0",
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check ."
format = "ruff format ."
check = ["ruff check --fix .", "ruff format ."]
test = "pytest tests/ -xvs"
run = "uvicorn app.main:app --reload --port 8000"
all = ["check", "test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "positive: positive test cases",
    "negative: negative test cases",
    "slow: slow tests",
]